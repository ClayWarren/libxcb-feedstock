{% set xorg_name = "libxcb" %}
{% set xorg_category = "lib" %}
{% set name = "libxcb" %}
{% set version = "1.17.0" %}
{% set sha256 = "2c69287424c9e2128cb47ffe92171e10417041ec2963bceafb65cb3fcf8f0b85" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://xorg.freedesktop.org/archive/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - windows.patch  # [win]

build:
  number: 1
  detect_binary_files_with_prefix: true
  run_exports:
    - {{ pin_subpackage('libxcb', max_pin='x') }}

requirements:
  build:
    - python                        # [build_platform != target_platform]
    - xcb-proto {{ version }}       # [build_platform != target_platform]
    # uses m2w64 toolchain on windows, see conda_build_config.yaml
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - m2-autoconf                   # [win]
    - m2-automake{{ am_version }}   # [win]
    - m2-libtool                    # [win]
    - pkg-config                    # [unix]
    - m2-pkg-config                 # [win]
    - gnuconfig                     # [unix]
    - m2-base                       # [win]
    - make                          # [unix]
    - m2-make                       # [win]
    - autoconf                      # [unix]
    - automake                      # [unix]
    - gettext                       # [unix]
    - libtool                       # [unix]
  host:
    - pthread-stubs
    - xorg-libxau
    - xorg-libxdmcp
    - xorg-util-macros
    # disabled while bootstrapping
    - xcb-proto {{ version }}       # [not riscv64]
    - xorg-xorgproto
  run:
    - pthread-stubs
    - xorg-libxau
    - xorg-libxdmcp

test:
  commands:
    {% set lib_idents = [
      "xcb",
      "xcb-composite",
      "xcb-damage",
      "xcb-dpms",
      "xcb-dri2",
      "xcb-glx",
      "xcb-present",
      "xcb-randr",
      "xcb-record",
      "xcb-res",
      "xcb-screensaver",
      "xcb-shape",
      "xcb-shm",
      "xcb-sync",
      "xcb-xf86dri",
      "xcb-xfixes",
      "xcb-xinerama",
      "xcb-xkb",
      "xcb-xtest",
      "xcb-xv",
      "xcb-xvmc",
    ] %}
    {% set lib_idents = lib_idents + ['xcb-dri3', 'xcb-render', 'xcb-xinput'] %}  # [not win]
    {% for lib_ident in lib_idents %}
    - test -f $PREFIX/lib/lib{{ lib_ident }}.dylib  # [osx]
    - test -f $PREFIX/lib/lib{{ lib_ident }}.so  # [linux]
    - if not exist %PREFIX%/Library/lib/lib{{ lib_ident }}.dll.a exit /b 1  # [win]
    - if not exist %PREFIX%/Library/bin/msys-{{ lib_ident }}-*.dll exit /b 1  # [win]
    {% endfor %}

about:
  home: http://xcb.freedesktop.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: "This is the C-language Binding (XCB) package to the X Window System protocol"

extra:
  recipe-maintainers:
    - ccordoba12
    - pkgw
